<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eef2ff);
        }
        .login-card {
            width: 100%;
            max-width: 390px;
            padding: 36px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(31, 41, 55, 0.12);
        }
        h1 { margin: 0 0 8px; color: #1e293b; text-align: center; }
        .subtitle { margin: 0 0 28px; color: #64748b; text-align: center; }
        label { display: block; margin: 15px 0 7px; color: #334155; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .error { margin: 12px 0; color: #dc2626; font-size: 14px; }
        .help { margin-top: 20px; color: #64748b; text-align: center; font-size: 13px; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your account</p>

        {% if form.errors %}
            <p class="error">Invalid username or password. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" placeholder="Enter your username" required autofocus>

            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <p class="help">Please enter your registered username and password.</p>
    </main>
</body>
</html>
